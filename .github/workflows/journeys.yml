name: Journeys

# The whole app, driven in a real browser against a real server: the
# journeys under apps/web/e2e/test/journeys/ (a club member's paths from end
# to end) plus a core set of e2e specs on every PR, and every e2e spec at
# night. Unit tests can all pass while a feature is useless (New module once
# made a module nothing could open); this is the check that catches that.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'  # nightly, every e2e spec
  workflow_dispatch:
    inputs:
      full:
        description: Run every e2e spec, not only the journeys and the core set
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same pinned BlueBrick parts library the desktop repo uses as its
  # submodule (parts/BlueBrickParts), so the specs find real parts.
  BLUEBRICK_PARTS_SHA: 85b41f50adea006686a3bf70e0727026a8f0971b

jobs:
  journeys:
    name: Journeys (e2e)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: &e2e-env
      DB_PATH: ${{ github.workspace }}/.e2e/e2e.sqlite
      PARTS_DIR: ${{ github.workspace }}/.e2e/BlueBrickParts
      BACKUPS_DIR: ${{ github.workspace }}/.e2e/backups
      ENABLE_PASSWORD_AUTH: 'true'
      COOKIE_SECURE: 'false'
      PUBLIC_URL: http://localhost:5173
      # Test accounts are minutes old; without these the "one club in an
      # account's first week" rule stops specs that make several clubs.
      LIMIT_NEW_ACCOUNT_CLUBS: '1000'
      LIMIT_CLUBS_PER_USER: '1000'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-stack
        with:
          parts-sha: ${{ env.BLUEBRICK_PARTS_SHA }}

      # Playwright starts the Vite dev server itself (playwright.config.ts
      # webServer), proxying /api, /ws and /parts to the server above.
      # The journeys change site-wide settings (catalogs, review, limits) the
      # way an admin would, so they run one at a time.
      - name: Journeys
        working-directory: apps/web
        run: npx playwright test e2e/test/journeys/ --workers=1 --retries=1 --reporter=list,html

      - name: Core specs
        working-directory: apps/web
        run: >
          npx playwright test
          e2e/test/auth.spec.ts
          e2e/test/layouts.spec.ts
          e2e/test/editor.spec.ts
          e2e/test/flexTouch.spec.ts
          e2e/test/snapping.spec.ts
          e2e/test/snapTouchReplay.spec.ts
          e2e/test/layoutFile.spec.ts
          e2e/test/savedViews.spec.ts
          e2e/test/moduleEditor.spec.ts
          e2e/test/moduleVersions.spec.ts
          e2e/test/modulesPanel.spec.ts
          e2e/test/orgs.spec.ts
          e2e/test/partsOnHome.spec.ts
          e2e/test/publicShare.spec.ts
          e2e/test/desktopParity.spec.ts
          e2e/test/tours.spec.ts
          e2e/test/bigLayoutWork.spec.ts
          e2e/test/a11y.spec.ts
          --workers=2 --retries=1 --reporter=list,html

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            .e2e/server.log
          retention-days: 14

  # At night: every spec, split across shards that run side by side. Each
  # shard is its own machine with its own server and database, and runs its
  # specs one at a time, because several of them change site-wide settings
  # (catalogs, limits) that the others would see. The shards split by file,
  # so a spec's tests stay together and in order.
  every-spec:
    name: Every e2e spec (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    # The specs stop themselves at 25 minutes (--global-timeout) and still
    # write their report; this is the backstop for a hung setup.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Sized so each shard's specs take about 15 minutes. Keep the
        # report job's SHARDS in step with this list.
        shard: [1, 2, 3, 4, 5, 6]
    env: *e2e-env
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-stack
        with:
          parts-sha: ${{ env.BLUEBRICK_PARTS_SHA }}

      - name: Every e2e spec
        working-directory: apps/web
        run: >
          npx playwright test
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --workers=1 --retries=1 --global-timeout=1500000
          --reporter=list,blob

      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: 3

      - name: Upload the shard's traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            .e2e/server.log
          retention-days: 14

  # One report for the whole night: every shard's results merged into one
  # HTML report and one summary on the run page.
  every-spec-report:
    name: Every e2e spec (report)
    needs: every-spec
    if: ${{ !cancelled() && needs.every-spec.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARDS: 6
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Download the shards' blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: apps/web/all-blob-reports

      - name: Merge the reports
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          mkdir -p all-blob-reports
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            npx playwright merge-reports --reporter=list,html,json ./all-blob-reports
          fi

      - name: Summary
        working-directory: apps/web
        run: |
          node ../../.github/scripts/e2e-summary.mjs merged.json all-blob-reports \
            "$SHARDS" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
