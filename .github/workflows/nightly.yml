name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One nightly at a time: a newer push to main cancels an older run still in
# progress, so an older commit can't finish last and overwrite :nightly.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: repo
        # Every image goes out under two names while the project is renamed:
        # <owner>/web (the new name) and <owner>/collaborative-brick-layout-designer
        # (the name existing deploys pull). Both follow the org if it is renamed.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=$owner/collaborative-brick-layout-designer" >> "$GITHUB_OUTPUT"
          echo "web=$owner/web" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # Every build gets immutable per-commit tags; only the build of the
      # commit that is still the tip of main also moves :nightly.
      - name: Build & push (per-commit tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}:nightly-${{ steps.sha.outputs.short }}
            ghcr.io/${{ steps.repo.outputs.web }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.web }}:nightly-${{ steps.sha.outputs.short }}
          build-args: |
            APP_VERSION=nightly-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Is this still the tip of main?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
          echo "tip=$tip"
          if [ "$tip" = "${{ github.sha }}" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi

      - name: Move :nightly to this build
        if: steps.tip.outputs.latest == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.repo.outputs.name }}:nightly \
            -t ghcr.io/${{ steps.repo.outputs.web }}:nightly \
            ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}

      - name: Main has moved on
        if: steps.tip.outputs.latest != 'true'
        run: echo "::notice::main has a newer commit; leaving :nightly to its build. This one is sha-${{ github.sha }} / nightly-${{ steps.sha.outputs.short }}."

  scan-image:
    name: Trivy image scan
    needs: image
    runs-on: ubuntu-latest
    # Usually under a minute. A stalled vulnerability-database download
    # used to hang here until the run was cancelled.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Lower-case repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        # Report only: a scan that times out leaves the nightly green.
        continue-on-error: true
        env:
          # The ECR mirror first: ghcr.io rate-limits the database downloads.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db
        with:
          timeout: 10m
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0' # report-only on nightly so we don't fail builds; release.yml is the gate
          ignore-unfixed: true
          skip-dirs: /root/.local/share/pnpm,/home/runner/.local/share/pnpm

      - name: Upload SARIF to code scanning
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  release-assets:
    name: Update :latest pre-release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Stage release assets
        run: |
          mkdir -p release
          cp .env.example release/

      - name: Update pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from the latest commit on `main`.

            **This is a pre-release** — use tagged releases for stable versions.

            Image: `ghcr.io/${{ github.repository }}:nightly` and `:sha-${{ github.sha }}`
          files: release/*
          prerelease: true
          make_latest: false
