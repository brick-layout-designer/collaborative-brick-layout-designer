name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commits
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          FAILED=0
          while IFS= read -r msg; do
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "::error::Bad commit message: $msg"
              echo "  Expected format: type(scope): description"
              echo "  Types: feat fix docs style refactor perf test build ci chore revert"
              FAILED=1
            fi
          done < <(git log --format='%s' origin/main..HEAD)

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "All commits must follow Conventional Commits: https://www.conventionalcommits.org"
            exit 1
          fi
          echo "All commits follow conventional commit format."

  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - run: pnpm typecheck
      - run: pnpm lint || true  # lint config lands in a follow-up; don't block PRs yet
      - run: pnpm test
      - run: pnpm build

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # AGPL-3.0-or-later is our license; allow common compatible licenses
          # plus AGPL itself. Reject anything more restrictive.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC,
            CC0-1.0, CC-BY-4.0, 0BSD, Unlicense,
            Apache-2.0 WITH LLVM-exception,
            AGPL-3.0-or-later, LGPL-2.1-or-later, LGPL-3.0-or-later,
            MPL-2.0, BlueOak-1.0.0, Python-2.0, Zlib

  osv-scan:
    name: OSV-Scanner (deps + actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false --ignore-scripts
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
