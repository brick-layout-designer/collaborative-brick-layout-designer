# Fewer, grouped update PRs (Aaron, 2026-10-12): each week at most one PR
# for dev tools, one for what runs on the server or in the page, one for
# GitHub Actions and one for Docker. Major versions still come one per PR,
# since those need a real look. Triage: dev-only groups merge on green;
# runtime ones wait for Aaron's OK.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: build
    groups:
      docker:
        patterns: ['*']
