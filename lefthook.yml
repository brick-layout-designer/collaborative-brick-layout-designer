# Local git hooks. Installed automatically by `pnpm install` via the
# `prepare` script (which runs `lefthook install`). Skip an individual
# hook with `LEFTHOOK_EXCLUDE=<name>` or all of them with `--no-verify`.
#
# These run on the developer's machine BEFORE the commit hits CI. CI runs
# the same checks again as a safety net (a developer can always bypass
# local hooks with `--no-verify`).

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm -r typecheck

    secret-scan:
      # Scans only what's about to be committed — fast on incremental commits.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --no-banner --redact -v --config .gitleaks.toml
        else
          echo "gitleaks not installed; skipping (install: https://github.com/gitleaks/gitleaks)"
        fi

commit-msg:
  commands:
    conventional:
      run: |
        PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
        if ! head -1 "{1}" | grep -qE "$PATTERN"; then
          echo "::error::commit message must follow Conventional Commits"
          echo "  example: feat(auth): add github oauth provider"
          exit 1
        fi

pre-push:
  commands:
    test:
      run: pnpm -r test
